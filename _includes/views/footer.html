<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="site-footer-inner">
        {%- assign currentYear = 'now' | date: "%Y" -%}
        {%- assign copyright = site.copyright
            | replace: '{currentYear}', currentYear
            | replace: '{author}', site.author
            | replace: '(c)', '&copy;'
            | replace: '(p)', '℗'
            | replace: '(cleft)', '<span class="copyleft">&copy;</span>'
        -%}
      <div>{{ copyright }}</div>

           href="https://fuys3rixxm.feishu.cn/wiki/OnLAwXJJ7iJDdakLHT1c2jP7nmB?fromScene=spaceOverview">我的飞书知识库</a>
        <a title="构建中，暂未公开" href="https://github.com/liangweilu/blogx">BlogX前后端分离博客系统</a>.
      </div>
      <!-- <div class="footer-col rss-subscribe">Subscribe <a href="{{ "/feed.xml" | relative_url }}">via RSS</a>
      </div>-->
    </div>
  </div>
</footer>
